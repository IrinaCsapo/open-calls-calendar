name: Weekly email

# Mondays 07:17 UTC (after the 07:00 scout): writes the weekly Magpie email and saves it in Brevo as a DRAFT
# campaign, sending a test copy to BREVO_TEST_EMAILS. Check it in Brevo → Campaigns and press send.
# Run it by hand from the Actions tab: "draft" (the default) or "send" (straight to everyone on the list).
on:
  schedule:
    - cron: '17 7 * * 1'   # off the hour on purpose: GitHub delays or drops busy :00 runs
    - cron: '47 8 * * 1'   # backups, in case earlier runs are late or dropped (GitHub skipped both on 23 Nov 2026);
    - cron: '37 9 * * 1'   # the script makes only one email a week, so extra runs just skip
    - cron: '57 10 * * 1'
    - cron: '27 12 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'draft = save in Brevo and send me a test; send = everyone on the list now'
        type: choice
        options: [draft, send]
        default: draft

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make the weekly email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID || vars.BREVO_LIST_ID }}
          BREVO_TEST_EMAILS: ${{ secrets.BREVO_TEST_EMAILS || vars.BREVO_TEST_EMAILS }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$BREVO_API_KEY" ] || [ -z "$BREVO_LIST_ID" ]; then
            echo "Brevo isn't set up yet, so this only prints the email's subject."
            npx tsx scripts/weekly-email.ts --preview /tmp/weekly.html
          else
            npx tsx scripts/weekly-email.ts $([ "$MODE" = "send" ] && echo --send)
          fi
