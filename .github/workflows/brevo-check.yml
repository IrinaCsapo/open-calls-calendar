name: Brevo check

# Read-only: prints Magpie's Brevo account status, recent email events and contacts (addresses masked).
# Use it when sign-up emails don't arrive. Sends and changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ask Brevo what happened
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: npx tsx scripts/brevo-check.ts
